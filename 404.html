<script>
  (function () {
    var match = /^\/midiweb-hub(?=\/|$)/i;
    var path = window.location.pathname;
    if (!match.test(path)) return;

    var rest = path.replace(match, '');
    var destination = '/MIDIWeb-Hub' + rest + window.location.search + window.location.hash;
    window.location.replace(destination);
  })();
</script>
